<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Jquery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <!-- Ini Hide And Show -->
    <button id="show">SHOW</button>
    <button id="hide">HIDE</button>
    <button id="toggle">TOGGLE</button>

    <p>ini akan kita <span>sembunyikan</span> dengan methode hide</p>

    <!-- Ini Fadein,fadeout dan Toggle -->
    <button id="fadein">FADE IN</button>
    <button id="fadeout">FADE OUT</button>
    <button id="fadetoggle">FADE TOGGLE</button>

    <div
      id="box1"
      style="width: 100px; height: 100px; background-color: red"
    ></div>

    <div
      id="box2"
      style="width: 100px; height: 100px; background-color: blue"
    ></div>

    <div
      id="box3"
      style="width: 100px; height: 100px; background-color: green"
    ></div>

    <br />
    <!-- Jquery Chaining -->
    <button id="chain">Chaining</button>
    <div
      id="box4"
      style="width: 100px; height: 100px; background-color: yellow"
    ></div>

    <!-- Jquery Animate -->
    <button id="animate">ANIMATE</button>
    <div
      id="box5"
      style="
        width: 100px;
        height: 50px;
        background-color: gray;
        position: relative;
      "
    >
      Jquery
    </div>

    <br />
    <!-- Jquery Get  -->
    <button id="getText">Get Text</button>
    <button id="getHtml">Get HTML</button>
    <button id="getVal">Get VAL</button>

    <p id="p1">Ini adalah <b> paragraf 1</b></p>
    <p id="p2">Ini adalah <b>paragraf 2</b></p>

    <label for="">Nama : </label>
    <input type="text" id="name" />

    <br />

    <!-- Jquery Add -->
    <button id="add">Add Paragraf</button>
    <button id="remove">Remove Paragraf</button>
    <p id="p3"></p>
    <!-- <p id="p4">Ini adalah paragraf p4</p> -->

    <script src="script.js"></script>
  </body>
</html>
